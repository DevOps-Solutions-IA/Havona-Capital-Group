name: havona-capital

x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AI_PROVIDER: ${AI_PROVIDER:-openrouter}
  AI_MODEL: ${AI_MODEL:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
  AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
  AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
  AI_MAX_INPUT_TOKENS: ${AI_MAX_INPUT_TOKENS:-8000}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1200}
  AI_MAX_TOOL_CALLS: ${AI_MAX_TOOL_CALLS:-4}
  AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
  VOICE_PROVIDER: ${VOICE_PROVIDER:-elevenlabs}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
  ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_multilingual_v2}
  ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-scribe_v1}
  ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io/v1}
  ELEVENLABS_HENRY_GATEWAY_SECRET: ${ELEVENLABS_HENRY_GATEWAY_SECRET:-}
  VOICE_MAX_AUDIO_SIZE: ${VOICE_MAX_AUDIO_SIZE:-10485760}
  VOICE_MAX_DURATION_SECONDS: ${VOICE_MAX_DURATION_SECONDS:-120}
  VOICE_REQUEST_TIMEOUT_MS: ${VOICE_REQUEST_TIMEOUT_MS:-30000}
  VOICE_STREAMING_ENABLED: ${VOICE_STREAMING_ENABLED:-true}
  VOICE_AUDIO_RETENTION_ENABLED: ${VOICE_AUDIO_RETENTION_ENABLED:-false}
  RESEND_ENABLED: ${RESEND_ENABLED:-false}
  GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
  META_WHATSAPP_ENABLED: ${META_WHATSAPP_ENABLED:-false}
  JITSI_ENABLED: ${JITSI_ENABLED:-false}

services:
  postgres:
    image: postgres:16-alpine
    profiles: [dev, prod, backup]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT_EXPOSED:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7-alpine
    profiles: [dev, prod]
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    ports:
      - '${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT_EXPOSED:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: production
    profiles: [prod]
    restart: unless-stopped
    environment:
      <<: *app-environment
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN}
      CORS_ORIGINS: ${APP_ORIGIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:3001/health/ready]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend, frontend]
    security_opt: [no-new-privileges:true]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: production
    profiles: [prod]
    restart: unless-stopped
    environment:
      <<: *app-environment
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:-havona-system}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, 'process.kill(1, 0)']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [backend]
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        APP_DOMAIN: ${APP_DOMAIN:-app.havonacapitalgroup.com}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://havonacapitalgroup.com}
    profiles: [prod]
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      APP_DOMAIN: ${APP_DOMAIN:-app.havonacapitalgroup.com}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://havonacapitalgroup.com}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://localhost:3000]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [frontend]
    security_opt: [no-new-privileges:true]

  api-dev:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: development
    profiles: [dev]
    environment:
      <<: *app-environment
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN}
      CORS_ORIGINS: ${APP_ORIGIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    ports: ['127.0.0.1:3001:3001']
    volumes: ['.:/app', 'api_node_modules:/app/node_modules']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend, frontend]
    security_opt: [no-new-privileges:true]

  worker-dev:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: development
    profiles: [dev]
    environment:
      <<: *app-environment
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:-havona-system}
      SMTP_FROM: ${SMTP_FROM:-HAVONA CAPITAL GROUP <no-reply@localhost>}
    volumes: ['.:/app', 'worker_node_modules:/app/node_modules']
    depends_on:
      redis: { condition: service_healthy }
    networks: [backend]
    security_opt: [no-new-privileges:true]

  web-dev:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: development
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        APP_DOMAIN: ${APP_DOMAIN:-app.havonacapitalgroup.com}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://havonacapitalgroup.com}
    profiles: [dev]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      APP_DOMAIN: ${APP_DOMAIN:-app.havonacapitalgroup.com}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://havonacapitalgroup.com}
    ports: ['127.0.0.1:3000:3000']
    volumes: ['.:/app', 'web_node_modules:/app/node_modules']
    depends_on:
      api-dev: { condition: service_started }
    networks: [frontend]
    security_opt: [no-new-privileges:true]

  proxy:
    image: caddy:2-alpine
    profiles: [prod]
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./infrastructure/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [frontend]
    security_opt: [no-new-privileges:true]

  backup:
    build:
      context: .
      dockerfile: infrastructure/backups/Dockerfile
    profiles: [backup]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    security_opt: [no-new-privileges:true]

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  api_node_modules:
  worker_node_modules:
  web_node_modules:
