name: havona-capital

x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    profiles: [dev, prod, backup]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT_EXPOSED:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7-alpine
    profiles: [dev, prod]
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    ports:
      - '${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT_EXPOSED:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: production
    profiles: [prod]
    restart: unless-stopped
    environment:
      <<: *app-environment
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN}
      CORS_ORIGINS: ${APP_ORIGIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://localhost:3001/health/ready]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend, frontend]
    security_opt: [no-new-privileges:true]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: production
    profiles: [prod]
    restart: unless-stopped
    environment:
      <<: *app-environment
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:-havona-system}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, 'process.kill(1, 0)']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [backend]
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    profiles: [prod]
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://localhost:3000]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [frontend]
    security_opt: [no-new-privileges:true]

  api-dev:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: development
    profiles: [dev]
    environment:
      <<: *app-environment
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN}
      CORS_ORIGINS: ${APP_ORIGIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    ports: ['127.0.0.1:3001:3001']
    volumes: ['.:/app', 'api_node_modules:/app/node_modules']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend, frontend]
    security_opt: [no-new-privileges:true]

  worker-dev:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: development
    profiles: [dev]
    environment:
      <<: *app-environment
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:-havona-system}
      SMTP_FROM: ${SMTP_FROM:-HAVONA CAPITAL GROUP <no-reply@localhost>}
    volumes: ['.:/app', 'worker_node_modules:/app/node_modules']
    depends_on:
      redis: { condition: service_healthy }
    networks: [backend]
    security_opt: [no-new-privileges:true]

  web-dev:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: development
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    profiles: [dev]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports: ['127.0.0.1:3000:3000']
    volumes: ['.:/app', 'web_node_modules:/app/node_modules']
    depends_on:
      api-dev: { condition: service_started }
    networks: [frontend]
    security_opt: [no-new-privileges:true]

  proxy:
    image: caddy:2-alpine
    profiles: [prod]
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./infrastructure/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [frontend]
    security_opt: [no-new-privileges:true]

  backup:
    build:
      context: .
      dockerfile: infrastructure/backups/Dockerfile
    profiles: [backup]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    security_opt: [no-new-privileges:true]

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  api_node_modules:
  worker_node_modules:
  web_node_modules:
